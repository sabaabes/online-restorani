<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>სისტემაში შესვლა</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; padding: 50px; }
        .form-container { background: white; padding: 30px; width: 350px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: left; }
        h2 { text-align: center; color: #333; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #0056b3; }
        input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        ul { color: #d9534f; font-size: 13px; padding-left: 20px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>შესვლა</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">შესვლა</button>
        </form>
    </div>

    <br>
    <a href="{% url 'menu' %}">← მენიუში დაბრუნება</a>

</body>
</html>
