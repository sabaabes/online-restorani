<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>შეკვეთა მიღებულია</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            text-align: center;
            padding-top: 100px;
            color: #333;
        }
        .success-box {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: #28a745; margin-bottom: 15px; }
        p { color: #666; margin-bottom: 25px; }
        .menu-btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .menu-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="success-box">
        <h2> მადლობა შეკვეთისთვის!</h2>
        <p>თქვენი შეკვეთა წარმატებით გაფორმდა და მალე დაგიკავშირდებით.</p>
        <a href="{% url 'menu' %}" class="menu-btn">მენიუში დაბრუნება</a>
    </div>

</body>
</html>
